<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เส้นทางเงินดูแลไฟ: ใครส่ง ผ่านใคร ติดเงื่อนไขอะไร มาถึงเมื่อไร</title>
<style>
/*__SHARED_CSS__*/
/* chart B */
.grp{margin-top:22px;font-size:18px;font-weight:700;color:var(--brand-ink);line-height:1.3}
.grp.state{color:var(--label-2)}
.rows{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.row{background:var(--raised);border:1px solid var(--sep-strong);border-radius:12px;overflow:hidden}
.rowbox{padding:12px 14px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr);grid-template-areas:"src" "via" "arr" "rules";align-items:start}
.c-src{grid-area:src}.c-via{grid-area:via}.c-arr{grid-area:arr}.c-rules{grid-area:rules}
.rbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:6px 12px;background:transparent;
  border:1.5px solid var(--sep-strong);border-radius:10px;color:var(--label);font:inherit;font-size:17px;font-weight:700;line-height:1.35;text-align:left}
.rbtn:hover{background:var(--tint)}
.chev{font-size:18px;color:var(--label-3);transition:transform .2s}
.rbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.rules{margin-top:8px}
.src{font-size:19px;font-weight:700;line-height:1.35;color:var(--label)}
.via{font-size:17px;color:var(--label-2);line-height:1.45}
.size{font-size:16px;color:var(--label-3);line-height:1.45;margin-top:2px}
/* arrival badge: glyph + the data's own words + a distinct border style. Never colour alone. */
.arr{display:inline-flex;align-items:flex-start;gap:8px;padding:6px 12px;border-radius:8px;font-size:17px;font-weight:700;line-height:1.4;max-width:100%}
.arr .g{font-size:18px;flex:0 0 auto;line-height:1.4}
.arr.before{background:var(--brand);color:#fff;border:2px solid var(--brand)}
:root[data-theme=dark] .arr.before{background:var(--s1);color:var(--s1-on);border-color:var(--s1)}
.arr.late{background:transparent;color:var(--label);border:2px solid var(--label)}
.arr.uncertain{background:var(--tint);color:var(--label);border:2px dashed var(--label-3)}
.arr.cycle{background:var(--tint);color:var(--label);border:2px solid transparent}
.chips{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-size:16px;line-height:1.4;padding:3px 12px;border:1px solid var(--sep-strong);border-radius:999px;color:var(--label-2);background:var(--bg)}
/* the single orange element on screen */
.callout{margin-top:10px;padding:12px 14px;border:2px dashed var(--cta);border-radius:12px;background:var(--raised);font-size:17px;color:var(--label);line-height:1.5}
.callout .x{font-weight:700}
/* budget */
.bud{margin-top:28px;padding-top:18px;border-top:1px solid var(--sep-strong)}
.bud h3{font-size:20px;font-weight:700;color:var(--label);line-height:1.3}
.bud .sub{font-size:16px;color:var(--label-3);line-height:1.4;margin-top:2px}
.bl{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:12px}
.bl .v{font-size:22px;font-weight:700;color:var(--label);line-height:1.25}
.bl .n{font-size:16px;color:var(--label-2);line-height:1.4}
.bl .tr{height:14px;background:var(--tint);border-radius:4px;margin-top:4px;overflow:hidden}
.bl .fi{height:100%;border-radius:4px;min-width:4px}
.bl li:nth-child(1) .fi{background:var(--s1)}
.bl li:nth-child(2) .fi{background:var(--s2)}
.bl li:nth-child(3) .fi{background:var(--s3)}
.bl li:nth-child(4) .fi{background:var(--label)}
.colh{display:none}
/* iframe >= 640px wide (article column on tablet/desktop): real 4-column grid, chips inline */
@media(min-width:640px){
  .colh{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.2fr) minmax(0,1.35fr) minmax(0,1.3fr);gap:16px;padding:8px 14px;margin-top:16px;font-size:16px;font-weight:700;color:var(--label-3);border-bottom:2px solid var(--label)}
  .rows{gap:0;margin-top:0}
  .row{border-radius:0;border:0;border-bottom:1px solid var(--sep-strong);background:transparent}
  .rowbox{grid-template-columns:minmax(0,1.25fr) minmax(0,1.2fr) minmax(0,1.35fr) minmax(0,1.3fr);grid-template-areas:"src via rules arr";gap:16px;padding:14px}
  /* wide: the rules column is always shown; the toggle button and its collapsed state are mobile-only */
  .rbtn{display:none}
  .rules[hidden]{display:block!important}
  .rules{margin-top:0}
}
</style>
</head>
<body>
<div class="wrap">
  <figure id="chart" role="img" aria-label="">
    <div class="kicker">เงินดูแลไฟมาจากไหน</div>
    <h2 class="title" id="t"></h2>
    <p class="lede" id="lede"></p>

    <div class="colh" id="colh" aria-hidden="true"><span>แหล่งเงิน</span><span>ส่งผ่าน / ขนาด</span><span>เงื่อนไขที่ติดมา</span><span>มาถึงเมื่อไร</span></div>
    <div id="groups"></div>
    <div class="bud" id="bud"></div>
  </figure>

  <div style="margin-top:16px"><button class="btn" id="tbtn" type="button" aria-pressed="false" aria-controls="tbl">ดูเป็นตาราง</button></div>
  <div class="tbl" id="tbl" hidden></div>

  <div class="foot" id="foot"></div>
</div>

<script>/*__SHARED_JS__*/</script>
<script>
var DATA=/*__DATA__*/null;
(function(){
  var B=DATA.chartB;
  // Glyph + label per arrival code. Text always shown; glyph is a second cue.
  var ARR={
    before:{g:"✓",l:"มาก่อนไฟ"},
    late:{g:"⏱",l:"มาช้า"},
    uncertain:{g:"?",l:"ไม่แน่นอน"},
    cycle:{g:"↻",l:"ตามรอบงบ"}
  };
  $("#t").textContent=B.title;
  $("#lede").textContent="ใครส่ง ผ่านใคร ติดเงื่อนไขอะไร และมาถึงเมื่อไร · แตะ \"เงื่อนไขที่ติดมา\" เพื่อดูรายละเอียด";

  function chips(rules){var u=el("ul",{class:"chips"});rules.forEach(function(r){u.appendChild(el("li",{text:r}))});return u}
  // Collapsed card = source + via/size + arrival badge (arrival is the story: never hidden).
  // Rules sit behind a real <button aria-expanded>. The first (private-money) card starts open.
  function row(f,idx,openFirst){
    var a=ARR[f.arrival]||{g:"",l:""};
    var li=el("li",{class:"row"}),id="rules"+idx;
    var box=el("div",{class:"rowbox"});
    box.appendChild(el("div",{class:"c-src"},[el("div",{class:"src",text:f.source})]));
    box.appendChild(el("div",{class:"c-via"},[el("div",{class:"via",text:f.via}),el("div",{class:"size",text:f.size})]));
    box.appendChild(el("div",{class:"c-arr"},[el("span",{class:"arr "+f.arrival,"aria-label":a.l+": "+f.arrival_text},
      [el("span",{class:"g","aria-hidden":"true",text:a.g}),el("span",{"aria-hidden":"true",text:f.arrival_text})])]));
    var btn=el("button",{type:"button",class:"rbtn","aria-expanded":"false","aria-controls":id},
      [el("span",{class:"rbl",text:"เงื่อนไขที่ติดมา ("+f.rules.length+")"}),el("span",{class:"chev","aria-hidden":"true",text:"▾"})]);
    var panel=el("div",{class:"rules",id:id,hidden:true},[chips(f.rules)]);
    function set(open){btn.setAttribute("aria-expanded",open?"true":"false");if(open)panel.removeAttribute("hidden");else panel.setAttribute("hidden","")}
    btn.addEventListener("click",function(){set(btn.getAttribute("aria-expanded")!=="true")});
    box.appendChild(el("div",{class:"c-rules"},[btn,panel]));
    li.appendChild(box);
    if(openFirst)set(true);
    return li;
  }

  var G=$("#groups"),idx=0;
  var groups=[["private","เงินเอกชน"],["state","เงินรัฐ"]];
  groups.forEach(function(g){
    var items=B.flows.filter(function(f){return f.group===g[0]});
    if(!items.length)return;
    G.appendChild(el("div",{class:"grp "+g[0],text:g[1]}));
    var ul=el("ul",{class:"rows"});
    items.forEach(function(f){ul.appendChild(row(f,idx,idx===0));idx++});
    G.appendChild(ul);
    // blocked callout sits directly under the private-money row
    items.forEach(function(f){
      if(f.blocked){
        // Text comes verbatim from data.json; only the glyph is added here.
        G.appendChild(el("div",{class:"callout",role:"note"},[el("span",{class:"x","aria-hidden":"true",text:"✕ "}),
          f.blocked]));
      }
    });
  });

  // Budget bars: width = value / max
  var bud=$("#bud");
  bud.appendChild(el("h3",{text:"เงินก้อนใหญ่อยู่ที่หน่วยงานรัฐ ไม่ใช่คนที่ขึ้นไปทำแนวกันไฟ"}));
  bud.appendChild(el("div",{class:"sub",text:"งบเกี่ยวกับไฟป่าและฝุ่นควัน จ.เชียงใหม่ ปีงบประมาณ 2569 (ล้านบาท)"}));
  var maxB=Math.max.apply(null,B.budget_cm_2569_million.map(function(b){return b.value}));
  var bl=el("ul",{class:"bl"});
  B.budget_cm_2569_million.forEach(function(b){
    var fi=el("div",{class:"fi"});fi.style.width=(b.value/maxB*100)+"%";
    bl.appendChild(el("li",{},[el("div",{class:"v num",text:fmt(b.value,1)+" ล้านบาท"}),el("div",{class:"n",text:b.label}),
      el("div",{class:"tr","aria-hidden":"true"},[fi])]));
  });
  bud.appendChild(bl);

  // Table alternative
  var tb=$("#tbl"),tbl=el("table");
  tbl.appendChild(el("caption",{text:B.title}));
  tbl.appendChild(el("thead",{},[el("tr",{},["กลุ่ม","แหล่งเงิน","ส่งผ่าน","ขนาด","เงื่อนไขที่ติดมา","มาถึงเมื่อไร"].map(function(h){return el("th",{scope:"col",text:h})}))]));
  var tbd=el("tbody");
  B.flows.forEach(function(f){tbd.appendChild(el("tr",{},[el("td",{text:f.group==="private"?"เงินเอกชน":"เงินรัฐ"}),el("td",{text:f.source}),
    el("td",{text:f.via}),el("td",{text:f.size}),el("td",{text:f.rules.join(" · ")}),
    el("td",{text:(ARR[f.arrival]||{}).l+" · "+f.arrival_text})]))});
  tbl.appendChild(tbd);
  var cap=el("table");
  cap.appendChild(el("caption",{text:"งบเกี่ยวกับไฟป่าและฝุ่นควัน จ.เชียงใหม่ ปีงบประมาณ 2569 (ล้านบาท)"}));
  cap.appendChild(el("thead",{},[el("tr",{},[el("th",{scope:"col",text:"รายการ"}),el("th",{scope:"col",class:"r",text:"ล้านบาท"})])]));
  var cb=el("tbody");B.budget_cm_2569_million.forEach(function(b){cb.appendChild(el("tr",{},[el("td",{text:b.label}),el("td",{class:"r num",text:fmt(b.value,1)})]))});
  cap.appendChild(cb);
  tb.appendChild(tbl);tb.appendChild(el("div",{style:"height:14px"}));tb.appendChild(cap);
  tableToggle($("#tbtn"),tb,$("#chart"));

  var f=$("#foot");
  f.appendChild(el("p",{},[el("b",{text:"หมายเหตุ: "}),B.note]));
  f.appendChild(el("p",{},[el("b",{text:"ที่มา: "}),B.source]));

  $("#chart").setAttribute("aria-label",B.title+". "+B.flows.length+" แหล่งเงิน: "+
    B.flows.map(function(x){return x.source+" ("+(ARR[x.arrival]||{}).l+")"}).join("; ")+
    ". มีแหล่งเดียวที่มาก่อนฤดูไฟคือเงินเอกชน. กดปุ่ม ดูเป็นตาราง เพื่อดูข้อมูลทั้งหมด");

  function ph(){try{parent.postMessage({type:"infographic-height",height:document.documentElement.scrollHeight},location.origin)}catch(e){}}
  addEventListener("load",ph);if(window.ResizeObserver)new ResizeObserver(ph).observe(document.body);
})();
</script>
</body>
</html>
